
<!-- Add Google Icons to index.html if not already present -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<aside class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
  <!-- Logo/Header -->
  <div class="h-20 flex items-center px-6 border-b border-gray-200">
    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-cyan-400 rounded-lg flex items-center justify-center shadow-md">
       <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor"></path>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </div>
    <div class="ml-3">
        <h2 class="text-base font-bold text-slate-800">AEK Company</h2>
        <p class="text-xs text-slate-500">{{ currentUser().name }}</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-4 overflow-y-auto">
    @for (item of filteredMenuItems(); track item.id) {
      <button 
        (click)="viewChange.emit(item.id)"
        class="w-full flex items-center gap-3 px-4 py-2.5 mb-1 rounded-lg text-sm font-medium transition-all duration-200 ease-in-out relative"
        [class]="currentView() === item.id ? 'bg-gradient-to-r from-indigo-500 to-cyan-500 text-white shadow' : 'text-slate-600 hover:bg-gray-100'">
        <i class="material-icons text-lg">{{ item.icon }}</i>
        <span>{{ item.label }}</span>
        @if (item.id === 'approvals' && pendingCount() > 0) {
          <span class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 bg-rose-500 text-white text-xs font-bold rounded-full flex items-center justify-center notification-badge-pulse">
            {{ pendingCount() }}
          </span>
        }
      </button>
    }
  </nav>

  <!-- Footer/Logout -->
  <div class="p-4 border-t border-gray-200">
    <button (click)="logout.emit()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-50 transition-colors">
      <i class="material-icons text-lg">logout</i>
      <span>ອອກຈາກລະບົບ</span>
    </button>
  </div>
</aside>
