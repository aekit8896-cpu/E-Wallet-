
<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 sm:p-12 max-w-sm w-full">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-indigo-500 to-cyan-400 rounded-full flex items-center justify-center shadow-lg">
        <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor"></path>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 mb-2">AEK Company</h1>
      <p class="text-sm text-slate-500">Internal E-Wallet & Accounting</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-2">ຊື່ຜູ້ໃຊ້</label>
        <input type="text" id="username" formControlName="username" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-base focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" required>
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-2">ລະຫັດຜ່ານ</label>
        <input type="password" id="password" formControlName="password" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-base focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" required>
      </div>
      
      @if (error()) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg text-sm">
          {{ error() }}
        </div>
      }
      
      <button type="submit" [disabled]="loginForm.invalid" class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75 transition disabled:opacity-50 disabled:cursor-not-allowed">
        ເຂົ້າສູ່ລະບົບ
      </button>
    </form>
    
    <div class="mt-6 pt-6 border-t border-slate-200">
      <p class="text-xs text-slate-500 text-center mb-1">ບັນຊີທົດລອງ:</p>
      <p class="text-xs text-slate-400 text-center">admin/admin123 | finance/finance123 | staff/staff123</p>
    </div>
  </div>
</div>
