
<div class="max-w-4xl mx-auto animate-fade-in">
  <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h2 class="text-xl font-bold text-slate-800 mb-6">ບັນທຶກລາຍຮັບໃໝ່</h2>

    @if (showSuccess()) {
      <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-md mb-6" role="alert">
        <p class="font-bold">ບັນທຶກສຳເລັດ!</p>
        <p>ລາຍການລາຍຮັບໄດ້ຖືກເພີ່ມເຂົ້າໃນລະບົບແລ້ວ.</p>
      </div>
    }

    <form [formGroup]="incomeForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="md:col-span-1">
        <label for="incomeDate" class="block text-sm font-medium text-slate-700 mb-2">ວັນທີ່</label>
        <input type="date" id="incomeDate" formControlName="date" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="md:col-span-1">
        <label for="incomeAmount" class="block text-sm font-medium text-slate-700 mb-2">ຈຳນວນເງິນ (₭)</label>
        <input type="number" id="incomeAmount" formControlName="amount" placeholder="0" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="md:col-span-2">
        <label for="incomeSource" class="block text-sm font-medium text-slate-700 mb-2">ແຫຼ່ງລາຍຮັບ</label>
        <input type="text" id="incomeSource" formControlName="source" placeholder="ເຊັ່ນ: ລູກຄ້າ A, ຂາຍສິນຄ້າ..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="md:col-span-2">
        <label for="incomeBankAccount" class="block text-sm font-medium text-slate-700 mb-2">ບັນຊີທະນາຄານ</label>
        <select id="incomeBankAccount" formControlName="bankAccount" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="" disabled>-- ເລືອກບັນຊີ --</option>
          @for (acc of dataService.bankAccounts(); track acc.id) {
            <option [value]="acc.name">{{ acc.name }} ({{ acc.number }})</option>
          }
        </select>
      </div>
      <div class="md:col-span-2">
        <label for="incomeReference" class="block text-sm font-medium text-slate-700 mb-2">ເລກອ້າງອີງ</label>
        <input type="text" id="incomeReference" formControlName="reference" placeholder="ເລກໃບບິນ, ເລກໂອນ..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="md:col-span-2">
        <label for="incomeNote" class="block text-sm font-medium text-slate-700 mb-2">ໝາຍເຫດ</label>
        <textarea id="incomeNote" formControlName="note" rows="3" placeholder="ລາຍລະອຽດເພີ່ມເຕີມ..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-y"></textarea>
      </div>
      <div class="md:col-span-2 text-right">
        <button type="submit" [disabled]="incomeForm.invalid || isSubmitting()" class="inline-flex items-center justify-center px-6 py-3 bg-cyan-600 text-white font-semibold rounded-lg shadow-md hover:bg-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-opacity-75 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="material-icons mr-2">save</i>
          <span>{{ isSubmitting() ? 'ກຳລັງບັນທຶກ...' : 'ບັນທຶກລາຍຮັບ' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
